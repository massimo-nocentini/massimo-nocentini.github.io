# Site bibliography, in tufte.hugo's native (BibTeX-like) schema: one map
# from a cite key to an entry (README "Bibliography"). Posts show an entry
# with {{< bibentry "key" >}}; {{< cite "key" >}} would put it in a sidenote.
#
# Every entry was moved here, field by field, from the {{< bibtex … >}}
# shortcode of the post named in the comment above it (the theme used before
# tufte.hugo); field names are lowercased, values are verbatim. `type` was
# added (the old shortcode had none): article for a journal, inproceedings
# for a booktitle, book, phdthesis, and misc for an entry with no venue.
# The theme prints the BibTeX fields it knows (author, title, journal,
# booktitle, publisher, address, year, month, volume, number, pages,
# edition, series, isbn, issn, doi, url, note…) and ignores the others,
# kept here as the record: abstract (also shown by the post, in its
# front-matter `abstract` or in an {{< abstract >}} block), keywords,
# issue_date, numpages, location, articleno, language, day, timestamp,
# biburl, bibsource.

# post/the-reasoned-schemer.md
bender2015efficient:
  type: misc
  author: "Bender, David and Kuper, Lindsey and Byrd, William and Friedman, Daniel"
  year: "2015"
  month: "03"
  url: "https://users.soe.ucsc.edu/~lkuper/papers/walk.pdf"
  abstract: "Unification, a fundamental process for logic programming systems, relies on the ability to efficiently look up values of variables in a substitution. Triangular substitutions, which allow associations to variables that are themselves bound by another association, are an attractive choice for purely functional implementations of logic programming systems because of their fast extension time and linear space requirement, but have the disadvantage of costly lookup. We present several representations for triangular substitutions that decrease the cost of lookup to linear or logarithmic time in the size of the substitution while maintaining most of their desirable properties. In particular, we show that triangular substitutions can be represented efficiently using skew binary random-access lists, and that this representation provides a significant decrease in running time for existing programs written in miniKanren, a declarative logic programming system implemented in a pure functional subset of Scheme."
  title: "Efficient representations for triangular substitutions: A comparison in miniKanren"

# post/2013-08-09-axioms-for-centrality.md
boldi2013axioms:
  type: article
  title: "Axioms for Centrality"
  author: "Paolo Boldi and Sebastiano Vigna"
  journal: "Internet Mathematics"
  year: "2013"
  volume: "10"
  pages: "222 - 262"
  abstract: "Abstract Given a social network, which of its nodes are more central? This question has been asked many times in sociology, psychology, and computer science, and a whole plethora of centrality measures (a.k.a. centrality indices, or rankings) were proposed to account for the importance of the nodes of a network. In this study, we try to provide a mathematically sound survey of the most important classic centrality measures known from the literature and propose an axiomatic approach to establish whether they are actually doing what they have been designed to do. Our axioms suggest some simple, basic properties that a centrality measure should exhibit. Surprisingly, only a new simple measure based on distances, harmonic centrality, turns out to satisfy all axioms; essentially, harmonic centrality is a correction to Bavelas’s classic closeness centrality [Bavelas 50] designed to take unreachable nodes into account in a natural way. As a sanity check, we examine in turn each measure under the lens of information retrieval, leveraging state-of-the-art knowledge in the discipline to measure the effectiveness of the various indices in locating webpages that are relevant to a query. Although there are some examples of such comparisons in the literature, here, for the first time, we also take into consideration centrality measures based on distances, such as closeness, in an information-retrieval setting. The results closely match the data we gathered using our axiomatic approach. Our results suggest that centrality measures based on distances, which in recent years have been neglected in information retrieval in favor of spectral centrality measures, do provide high-quality signals; moreover, harmonic centrality pops up as an excellent general-purpose centrality index for arbitrary directed graphs."
  url: "https://api.semanticscholar.org/CorpusID:10140116"

# post/the-reasoned-schemer.md
byrd2009relational:
  type: phdthesis
  author: "William E. Byrd"
  year: "2009"
  title: "Relational programming in minikanren: techniques, applications, and implementations"
  url: "https://dl.acm.org/doi/10.5555/1834996"
  abstract: "The promise of logic programming is that programs can be written relationally , without distinguishing between input and output arguments. Relational programs are remarkably flexible—for example, a relational type-inferencer also performs type checking and type inhabitation, while a relational theorem prover generates theorems as well as proofs and can even be used as a simple proof assistant. Unfortunately, writing relational programs is difficult, and requires many interesting and unusual tools and techniques. For example, a relational interpreter for a subset of Scheme might use nominal unification to support variable binding and scope, Constraint Logic Programming over Finite Domains (CLP(FD)) to implement relational arithmetic, and tabling to improve termination behavior. In this dissertation I present miniKanren , a family of languages specifically designed for relational programming, and which supports a variety of relational idioms and techniques. I show how miniKanren can be used to write interesting relational programs, including an extremely flexible lean tableau theorem prover and a novel constraint-free binary arithmetic system with strong termination guarantees. I also present interesting and practical techniques used to implement miniKanren, including a nominal unifier that uses triangular rather than idempotent substitutions and a novel “walk”-based algorithm for variable lookup in triangular substitutions. The result of this research is a family of languages that supports a variety of relational idioms and techniques, making it feasible and useful to write interesting programs as relations."

# post/minikanren-live-and-untagged.md
byrd2012minikanren:
  type: inproceedings
  author: "Byrd, William E. and Holk, Eric and Friedman, Daniel P."
  title: "miniKanren, live and untagged: quine generation via relational interpreters (programming pearl)"
  year: "2012"
  isbn: "9781450318952"
  publisher: "Association for Computing Machinery"
  address: "New York, NY, USA"
  url: "https://doi.org/10.1145/2661103.2661105"
  doi: "10.1145/2661103.2661105"
  abstract: "We present relational interpreters for several subsets of Scheme, written in the pure logic programming language miniKanren. We demonstrate these interpreters running \"backwards\"---that is, generating programs that evaluate to a specified value---and show how the interpreters can trivially generate quines (programs that evaluate to themselves). We demonstrate how to transform environment-passing interpreters written in Scheme into relational interpreters written in miniKanren. We show how constraint extensions to core miniKanren can be used to allow shadowing of the interpreter's primitive forms (using the absent° tree constraint), and to avoid having to tag expressions in the languages being interpreted (using disequality constraints and symbol/number type-constraints), simplifying the interpreters and eliminating the need for parsers/unparsers.We provide four appendices to make the code in the paper completely self-contained. Three of these appendices contain new code: the complete implementation of core miniKanren extended with the new constraints; an extended relational interpreter capable of running factorial and doing list processing; and a simple pattern matcher that uses Dijkstra guards. The other appendix presents our preferred version of code that has been presented elsewhere: the miniKanren relational arithmetic system used in the extended interpreter."
  booktitle: "Proceedings of the 2012 Annual Workshop on Scheme and Functional Programming"
  pages: "8–29"
  numpages: "22"
  keywords: "tagging, scheme, relational programming, quines, miniKanren, logic programming, interpreters"
  location: "Copenhagen, Denmark"
  series: "Scheme '12"


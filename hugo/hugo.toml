baseurl = "https://massimo-nocentini.github.io"
DefaultContentLanguage = "en"
title = "Massimo Nocentini"
# Using theme as git submodule
theme = "beautifulhugo"
# Or when using theme as a hugo module:
# [[module.imports]]
#   path = "github.com/halogenica/beautifulhugo/v5"
#
# The theme ships its own hugo.toml: it requires Hugo >= 0.146.2 (standard
# edition is enough, no SCSS/WebP) and supplies the params defaults
# colorScheme = "auto" and mathEngine = "katex", which the values below
# override. Hugo merges params from a theme config but not [markup], so the
# markup settings have to stay here.
enableGitInfo = true
ignoreLogs = ['warning-goldmark-raw-html']

[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS"]
  page = ["HTML"]

[security]
  allowContent = ['^text/html$', '^text/markdown$']

[markup]
  [markup.tableOfContents]
    endLevel = 5
    ordered = false
    startLevel = 0

  # Chroma highlighting. noClasses = false makes Chroma emit CSS classes so the
  # theme's assets/css/syntax.css and syntax-dark.css are used (this replaces the
  # legacy top-level pygments* keys).
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true

  # Enables {.class #id} attribute blocks on headings, tables, code fences, ...
  [markup.goldmark.parser.attribute]
    block = true

# Ranking configuration for Params.showRelatedPosts (Hugo's related-content
# engine). Without it Hugo ranks "See also" by the keywords and date indices
# only -- never by tags, which is what this site actually uses.
[related]
  includeNewer = true
  threshold = 80
  toLower = false
  [[related.indices]]
    name = "tags"
    weight = 100
  [[related.indices]]
    name = "categories"
    weight = 90
  [[related.indices]]
    name = "keywords"
    weight = 80
  [[related.indices]]
    name = "date"
    weight = 10

[Params]
  homeTitle = "This site needs no title"
  subtitle = "Massimo Nocentini's papers, notes, memos and source code."
  commit = "https://github.com/massimo-nocentini/massimo-nocentini.github.io/commit/"
  mainSections = ['post']
#  logo = "samurai.jpg" # Expecting square dimensions
  favicon = "samurai.jpg"
  dateFormat = "January 2, 2006" # or a locale token such as ":date_long"
  since = 2016 # start year of the footer copyright range
  toc = true
  #commit = true
  rss = true
  comments = false
  readingTime = true
  navShort = false
  wordCount = false
#  useHLJS = true
  socialShare = false
  delayDisqus = false
  showRelatedPosts = true
  related_content_limit = 100 # max number of related posts to list
#  cusdisID = "XXX" # Get your App id from cusdis.com
  showPostNav = true
  hideAuthor = false
  mathEngine = "katex" # "katex", "mathjax" or "none"
  colorScheme = "light" # "auto", "light" or "dark"
  selfHosted = false
  showSource = false
  sourceRepo = "https://github.com/massimo-nocentini/massimo-nocentini.github.io/blob/master/hugo/content/"
  ghBadge = ["star", "fork"]
  ghCount = true
#  disableFigureOverride = true # use Hugo's native figure shortcode instead of the theme's
#  headerImgStyle = "narrow" # "big" (default) or "narrow"; applies to Params.bigimg headers
#  showPageDates = true # show dates on "page" type content
#  hidePostDates = true # hide dates on "post" type content
#  disableCanonical = true # suppress <link rel="canonical"> site-wide

# Build-time image processing (page-bundle and assets/ images only; anything
# under static/, such as samurai.jpg, is always served untouched).
#  imageProcessing = false # turn the whole feature off
#  imageWidths = [480, 800, 1200, 1600] # srcset variants for figures/galleries
#  bigimgWidth = 1920 # max width for Params.bigimg header resources

# Optional schema.org/JSON-LD overrides (see the theme's "SEO & i18n" page).
#  organizationName = "Massimo Nocentini"
#  organizationLogo = "https://massimo-nocentini.github.io/samurai.jpg"
#  alternatePageName = "Massimo Nocentini's notes"
  socialProfiles = [
    "https://github.com/massimo-nocentini",
    "https://gitlab.com/massimo-nocentini",
  ]

# Site-wide <meta name="robots"> defaults; only applies to Params.mainSections.

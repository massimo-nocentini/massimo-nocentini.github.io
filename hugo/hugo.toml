# Massimo Nocentini's site, built with the tufte.hugo theme
# (https://github.com/massimo-nocentini/tufte.hugo, a git submodule in
# themes/tufte.hugo). The theme's README is the manual of every key below.
#
# The theme needs Hugo 0.169.0 or newer (standard edition). `make build`
# writes the site to ../docs.

baseURL = "https://massimo-nocentini.github.io/"
locale = "en-US"
defaultContentLanguage = "en"
title = "Massimo Nocentini"
theme = "tufte.hugo"

# Sections listed on the home page and in the archives. Every post lives in
# content/post/, so URLs stay /post/<file name>/.
mainSections = ["post"]

# No enableGitInfo: tufte.hugo reads no Git data, and the "updated on" date
# of a post comes only from an explicit front-matter `lastmod` (else it is
# the `date`), so the commit that moved the site to tufte.hugo does not mark
# every post as updated on that day.

# Some posts hide a block (an old log, structured data) in an HTML comment.
# With markup.goldmark.renderer.unsafe = false (below) Goldmark leaves it out
# of the page, which is what a comment is for: no need to warn about it.
ignoreLogs = ["warning-goldmark-raw-html"]

[frontmatter]
  lastmod = ["lastmod", "date"]

[pagination]
  pagerSize = 10

# Hugo does not merge [taxonomies] from a theme. `author` holds the authors
# of the papers and books a post is about; its plural is also "author", so
# the term pages keep their URLs (/author/donald-e.-knuth/).
[taxonomies]
  tag = "tags"
  category = "categories"
  author = "author"

# A site [outputs] replaces Hugo's defaults, so html and rss are listed
# again; `searchindex` is the theme's search index (/search-index.json).
[outputs]
  home = ["html", "rss", "searchindex"]
  section = ["html", "rss"]

[params]
  subtitle = "Massimo Nocentini's papers, notes, memos and source code."
  description = "Massimo Nocentini's papers, notes, memos and source code."
  sections = "h2"
  footnotes = "sidenotes"
  showReadingTime = true
  showWordCount = false
  showPostNav = true
  # A table of contents only where a post asks for it (front matter
  # `toc = true`): most posts are short.
  toc = false
  readMore = true
  homeIntro = true
  # Site styles (assets/css/site.css): repository links, the included test
  # suites, run-in headings followed by a list. Appended after the theme's
  # CSS, so its rules win.
  customCSS = ["css/site.css"]

  [params.author]
    name = "Massimo Nocentini"
    url = "https://massimo-nocentini.github.io/"

  [params.social]
    github = "massimo-nocentini"
    gitlab = "massimo-nocentini"
    email = "massimo.nocentini@gmail.com"
    rss = true

  # Math is typeset with KaTeX at build time (no JavaScript); its assets are
  # loaded only on the pages that show a formula.
  [params.math]
    enable = "auto"
    engine = "server"

  [params.comments]
    enable = false

  # Site search: a box in the site header (press "/") and the results page
  # content/search.md. Headings are always indexed; the text of a page is
  # capped, so the index of the long posts and of the test suites (included
  # HTML) stays small enough to download on first use.
  [params.search]
    enable = true
    contentChars = 50000

  # tufte-latex options (README "tufte-latex parity"). The site keeps the
  # Tufte CSS look; only the bibliography differs from the defaults.
  [params.tufte]
    # Posts show the works they are about with {{< bibentry >}} (the
    # formatted entry of data/bibliography.yaml, in the text): no automatic
    # "References" list repeating them at the end of the page
    # (\nobibliography). A post that cites with {{< cite >}} and wants the
    # list adds {{< bibliography >}} where it belongs.
    [params.tufte.bibliography]
      list = false

# Hugo does not merge [markup] from a theme: these are the settings the
# theme's render hooks need (README "Required site configuration").
[markup]
  [markup.goldmark]
    # No raw HTML in the content: every construct has a shortcode or a render
    # hook, and the only HTML the posts hold is comments. Shortcode output
    # ({{< include >}}, {{< github >}}…) is not affected.
    [markup.goldmark.renderer]
      unsafe = false
    [markup.goldmark.parser]
      # Required: a stand-alone image becomes a <figure> (image render hook).
      wrapStandAloneImageWithinParagraph = false
      # Keep it: section numbers, cross-references and the TOC follow ids.
      autoHeadingID = true
      [markup.goldmark.parser.attribute]
        # {.fullwidth} on tables and code fences, {author="…"} on quotes.
        block = true
        # {#sec:x} labels on headings.
        title = true
    [markup.goldmark.extensions]
      # Math: \( … \) and $ … $ inline, \[ … \] and $$ … $$ display. A
      # literal dollar sign in prose is written \$.
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['\[', '\]'], ['$$', '$$']]
          inline = [['\(', '\)'], ['$', '$']]
  [markup.highlight]
    # Chroma emits classes, coloured by the theme's syntax.css (light and
    # dark). A fence without a language stays plain text: guesses are
    # unreliable.
    noClasses = false
    codeFences = true
    guessSyntax = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false

# The site header menu. pageRef makes Hugo check that each page exists.
[[menus.main]]
  name = "About"
  pageRef = "/about"
  weight = 10
[[menus.main]]
  name = "Posts"
  pageRef = "/post"
  weight = 20
[[menus.main]]
  name = "Books"
  pageRef = "/book"
  weight = 25
[[menus.main]]
  name = "Archives"
  pageRef = "/archives"
  weight = 30
[[menus.main]]
  name = "Categories"
  pageRef = "/categories"
  weight = 40
[[menus.main]]
  name = "Tags"
  pageRef = "/tags"
  weight = 50
[[menus.main]]
  name = "Authors"
  pageRef = "/author"
  weight = 60
[[menus.main]]
  name = "Search"
  pageRef = "/search"
  weight = 70

# Build the Hugo site in hugo/ and deploy it to GitHub Pages.
#
# One-time setup: repository Settings → Pages → Build and deployment →
# Source: "GitHub Actions" (this replaces the old "Deploy from a branch",
# master /docs, which served a build committed to the repository).

name: Deploy site to GitHub Pages

on:
  push:
    branches: ["master"]
  pull_request:
  workflow_dispatch:

# Least privilege: read the repository, deploy to Pages, and mint the OIDC
# token that actions/deploy-pages needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel one that is in progress.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The theme is the git submodule hugo/themes/tufte.hugo.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      # tufte.hugo requires the latest Hugo release: resolve it from the
      # GitHub releases API (authenticated against rate limits), then install
      # its standard edition .deb after checking it against the release
      # checksums. Same procedure as the theme's own pages.yml.
      - name: Install the latest Hugo (standard edition)
        working-directory: ${{ runner.temp }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(curl -sSfL --retry 3 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/gohugoio/hugo/releases/latest |
            python3 -I -c 'import json, sys; print(json.load(sys.stdin)["tag_name"])')
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::unexpected Hugo tag '$tag'"; exit 1; }
          HUGO_VERSION=${tag#v}
          base="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          deb="hugo_${HUGO_VERSION}_linux-amd64.deb"
          curl -sSfL -o "$deb" "$base/$deb"
          curl -sSfL -o checksums.txt "$base/hugo_${HUGO_VERSION}_checksums.txt"
          grep " ${deb}\$" checksums.txt | sha256sum -c -
          sudo dpkg -i "$deb"
          installed=$(hugo version)
          echo "$installed"
          [[ "$installed" == "hugo v${HUGO_VERSION}"[-\ ]* ]] || { echo "::error::installed Hugo is not v${HUGO_VERSION}"; exit 1; }
          echo "Hugo: \`$installed\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        working-directory: hugo
        env:
          HUGO_ENVIRONMENT: production
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          hugo --gc --minify --baseURL "$BASE_URL/"

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: hugo/public

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
